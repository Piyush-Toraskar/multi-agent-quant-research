[project]
name = "multi-agent-quant-research"
version = "1.0.0"
description = "Auditable multi-agent quantitative research with MCP tools"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = ["integration: local subprocess or workflow integration", "external: requires an optional integration package"]

[tool.ruff]
line-length = 120
target-version = "py311"
